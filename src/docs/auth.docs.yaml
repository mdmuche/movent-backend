paths:
  /v1/auth/register:
    post:
      summary: Register a new user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fullName
                - email
                - password
                - location
              properties:
                fullName:
                  type: string
                email:
                  type: string
                password:
                  type: string
                location:
                  type: string
      responses:
        201:
          description: User registered successfully
        409:
          description: Conflict - User already exists

  /v1/auth/verify-email/{token}:
    get:
      summary: Verify user email
      tags: [Auth]
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        200:
          description: Email verified

  /v1/auth/login:
    post:
      summary: Login user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        200:
          description: Login successful
        401:
          description: Unauthorized - Invalid credentials
        403:
          description: Forbidden - Email not verified
