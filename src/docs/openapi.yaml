  /v1/checkout/resend-ticket/{ticketId}:
    post:
      tags: [Checkout]
      summary: Resend ticket
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: Ticket resent
  /v1/checkout/validate-ticket/{ticketId}:
    post:
      tags: [Checkout]
      summary: Validate ticket at event
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: Ticket validation result

  /v1/notification:
    post:
      tags: [Notifications]
      summary: Create notification
      security:
        - cookieAuth: []
      responses:
        "201":
          description: Notification created
    get:
      tags: [Notifications]
      summary: Get current user notifications
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Notifications fetched
  /v1/notification/unread-count:
    get:
      tags: [Notifications]
      summary: Get unread notification count
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Unread count fetched
  /v1/notification/{notificationId}/read:
    patch:
      tags: [Notifications]
      summary: Mark notification as read
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/NotificationId"
      responses:
        "200":
          description: Notification marked read
  /v1/notification/mark-all-read:
    patch:
      tags: [Notifications]
      summary: Mark all notifications as read
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Notifications marked read
  /v1/notification/{notificationId}:
    delete:
      tags: [Notifications]
      summary: Delete notification
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/NotificationId"
      responses:
        "200":
          description: Notification deleted

  /v1/admin/overview:
    get:
      tags: [Admin]
      summary: Get platform overview
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Overview fetched
  /v1/admin/event-queue:
    get:
      tags: [Admin]
      summary: Get event approval queue
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Event queue fetched
  /v1/admin:
    get:
      tags: [Admin]
      summary: Get all users
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Users fetched
  /v1/admin/settings:
    get:
      tags: [Admin]
      summary: Get system settings
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Settings fetched
    patch:
      tags: [Admin]
      summary: Update system settings
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Settings updated
  /v1/admin/audit-logs:
    get:
      tags: [Admin]
      summary: Get audit logs
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Audit logs fetched
  /v1/admin/reports/export:
    get:
      tags: [Admin]
      summary: Export platform reports
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Report exported
  /v1/admin/users/{id}/make-organizer:
    patch:
      tags: [Admin]
      summary: Promote user to organizer
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: User promoted
  /v1/admin/users/{userId}/flag:
    patch:
      tags: [Admin]
      summary: Flag user
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User flagged
  /v1/admin/users/{userId}/suspend:
    patch:
      tags: [Admin]
      summary: Suspend user
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User suspended

  /v1/newsletter/subscribe:
    post:
      tags: [Newsletter]
      summary: Subscribe to newsletter
      responses:
        "201":
          description: Subscriber created
  /v1/newsletter/unsubscribe:
    post:
      tags: [Newsletter]
      summary: Unsubscribe from newsletter
      responses:
        "200":
          description: Subscriber removed
  /v1/newsletter/subscribers:
    get:
      tags: [Newsletter]
      summary: Get newsletter subscribers
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Subscribers fetched
